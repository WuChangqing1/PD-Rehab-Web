# PD-Rehab-Web —— ccqspace.site (HTTPS) 下的 /pd-rehab/ 位置片段
#
# 本文件是**新增 snippet**，通过 include 挂进已存在的 443 server 块，
# **不修改** ccqspace.site 原有的 /、/home/、/market/、/api/ 任何配置。
#
# 为什么需要它：纯 IP + HTTP 不是 Secure Context，浏览器会禁用摄像头。
# 走 https://ccqspace.site/pd-rehab/ 才能启用录制功能。
#
# 安装：
#   sudo cp deploy/nginx/pd-rehab-locations.conf /etc/nginx/snippets/
#   # 在 conf.d/mysite.conf 的 443 server 块中加入：
#   #   include /etc/nginx/snippets/pd-rehab-locations.conf;
#   sudo nginx -t && sudo systemctl reload nginx

# ---- 后端 API：/pd-rehab/api/... -> 127.0.0.1:18086/api/... ----
# 注意：这里必须比已有的 /api/ 更具体，nginx 才会优先匹配本前缀。
location /pd-rehab/api/ {
    proxy_pass         http://127.0.0.1:18086/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    client_max_body_size 500m;
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_request_buffering off;
}

# ---- 前端静态产物（VITE_BASE=/pd-rehab/ 构建）----
location /pd-rehab/assets/ {
    alias /var/www/pd-rehab/dist-under-path/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /pd-rehab/ {
    alias /var/www/pd-rehab/dist-under-path/;
    index index.html;
    # SPA 路由回退：把 /pd-rehab/xxx 都交给 index.html
    try_files $uri $uri/ /pd-rehab/index.html;
}

# index.html 必须每次回源校验。
#
# 没有这一条时 nginx 只发 ETag / Last-Modified，浏览器会按"启发式缓存"自行决定
# 缓存多久，于是一次重新部署之后浏览器仍拿着旧的 index.html，继续去加载**旧的**
# 带 hash 的 chunk，页面上看不到任何更新（已被同事遇到过两次）。
# 静态资源本身仍然是一年不可变缓存，只有这张入口文件需要回源。
location = /pd-rehab/index.html {
    alias /var/www/pd-rehab/dist-under-path/index.html;
    add_header Cache-Control "no-cache, must-revalidate";
    etag on;
}

# 便于确认部署版本
location = /pd-rehab {
    return 301 /pd-rehab/;
}
